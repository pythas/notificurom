version: '3.8'

services:
  notificurom:
    build: .
    container_name: notificurom
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - GITHUB_PAT=${GITHUB_PAT:-}
      - CRON_SECRET=${CRON_SECRET:-}
